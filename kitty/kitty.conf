font_family      JetBrainsMono Nerd Font
# Lean inset: clear the curve without eating the cell grid (bezel INSET_PX ≈ 18).
window_padding_width 22
tab_bar_style hidden
hide_window_decorations yes

#selection_foreground     #f8f8f2
#selection_background     #cc241d

#active_border_color      #ff5555
#inactive_border_color    #555555

#active_tab_foreground    #f8f8f2
#active_tab_background    #cc241d
#inactive_tab_foreground  #d0d0d0
#inactive_tab_background  #333333

#background               #000000
#foreground               #f0f0f0

background_opacity 1.0
cursor_blink_interval 0

# Old flat mono palette; superseded by Catppuccin-Mocha below.
# include theme.conf

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Bezel rim black; brighter text so CRT/TFT dimming stays readable.
background #000000
foreground #F5F5FF
cursor #F5E0DC
color7 #E6E9F5
color15 #FFFFFF

# CRT look from the video is Kitty post-processing (needs kitty >= 0.49).
# System /usr/bin/kitty is 0.48 and silently ignores this key.
# Use: ~/.local/bin/kitty  (official 0.51 install under ~/.local/kitty.app)
custom_shaders crt-retro
#
# Font in the video: Fixis (or Cosette Scientific Pro / Clean Terminus).
# Fixis is not installed here; keeping JetBrainsMono Nerd Font.
# font_family Fixis
# Perf: shaders already slang-cached under ~/.cache/kitty/shaders; remaining
# open cost is the layered GL path (~+150ms). Switch without restart:
map ctrl+alt+p load_config_file ~/.config/kitty/kitty-perf.conf
map ctrl+alt+o load_config_file ~/.config/kitty/kitty.conf
